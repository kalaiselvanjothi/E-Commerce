<div class="admin-layout">

  <!-- ── Sidebar ────────────────────────────────────────── -->
  <aside class="admin-sidebar" role="navigation" aria-label="Admin navigation">

    <!-- Logo -->
    <div class="sidebar-logo">
      <div class="logo-mark">SV</div>
      <div class="logo-text-wrap">
        <div class="logo-title">ShopVerse</div>
        <div class="logo-sub">Admin Console</div>
      </div>
    </div>

    <!-- Nav Items -->
    <nav class="sidebar-nav">
      <p class="nav-section-label">Main Menu</p>
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          class="nav-link"
          [attr.id]="'admin-nav-' + item.label.toLowerCase()"
        >
          <span class="nav-icon" [innerHTML]="item.icon"></span>
          <span class="nav-label">{{ item.label }}</span>
          <span class="nav-active-dot"></span>
        </a>
      }
    </nav>

    <!-- Footer -->
    <div class="sidebar-footer">
      <div class="sidebar-divider"></div>
      <a routerLink="/" class="nav-link back-link" id="admin-back-to-store">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/>
          </svg>
        </span>
        <span class="nav-label">Back to Store</span>
      </a>
    </div>

  </aside><!-- /sidebar -->

  <!-- ── Main Content ─────────────────────────────────────── -->
  <main class="admin-main">
    <router-outlet />
  </main>

</div>
